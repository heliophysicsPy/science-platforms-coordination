name: Build Environment Images

on:
  push:
    branches:
      - heliocloud-base-2025-update
      - heliocloud-base-w-survey-core
      - heliocloud-base-w-survey-extended
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        type: choice
        options:
        - heliocloud-base-2025-update
        - heliocloud-base-w-survey-core
        - heliocloud-base-w-survey-extended

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout files in repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false  # the next step fetches notebooks.tar.gz from LFS only if the checked-out Dockerfile needs it
          fetch-depth: 0

      - name: Prepare notebooks.tar.gz for the checked-out Dockerfile
        run: |
          if grep -q '^ARG NOTEBOOKS_SHA256=' Dockerfile; then
            # This Dockerfile downloads the pinned archive itself; make sure the pin matches this commit's notebooks.tar.gz
            oid=$(sed -n 's/^oid sha256://p' notebooks.tar.gz)
            if [ -z "$oid" ] || ! grep -q "^ARG NOTEBOOKS_SHA256=$oid$" Dockerfile; then
              echo "::error::NOTEBOOKS_SHA256 in the Dockerfile doesn't match notebooks.tar.gz (LFS oid: ${oid:-not found}). Update NOTEBOOKS_COMMIT and NOTEBOOKS_SHA256."
              exit 1
            fi
          elif [ -f notebooks.tar.gz ]; then
            # Older Dockerfiles copy the archive from the build context, so fetch it from LFS
            git lfs install --local
            git lfs pull --include notebooks.tar.gz
          fi

      - name: Get actual commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD | cut -c1-12)
          echo "Commit SHA: $SHA"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "GITHUB_SHA=$SHA" >> $GITHUB_ENV

      - name: Free Disk Space for Docker Build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # Keep false since you need Docker
          swap-storage: true

      - name: update jupyter dependencies with repo2docker
        uses: jupyterhub/repo2docker-action@master
        env:
          GITHUB_SHA: ${{ steps.get-sha.outputs.sha }}
        with:
          DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          DOCKER_REGISTRY: "quay.io"
          IMAGE_NAME: "sapols/${{ github.event.inputs.branch || github.ref_name }}"
          ADDITIONAL_TAG: ${{ steps.get-sha.outputs.sha }}
          COMMIT_MSG: "Update image tag to ${{ steps.get-sha.outputs.sha }}"
          BINDER_CACHE: true
          PUBLIC_REGISTRY_CHECK: true
